name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9.12.0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        id: pages
      - name: Export static website
        run: pnpm build:web
        env:
          EXPO_BASE_URL: ${{ steps.pages.outputs.base_path }}
          EXPO_PUBLIC_API_BASE_URL: ${{ vars.EXPO_PUBLIC_API_BASE_URL }}
          MANUS_PROJECT_ID: ${{ vars.MANUS_PROJECT_ID }}
          MANUS_OAUTH_PORTAL_URL: ${{ vars.MANUS_OAUTH_PORTAL_URL }}
          MANUS_OAUTH_API_URL: ${{ vars.MANUS_OAUTH_API_URL }}
          OWNER_OPEN_ID: ${{ vars.OWNER_OPEN_ID }}
          OWNER_NAME: ${{ vars.OWNER_NAME }}
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
